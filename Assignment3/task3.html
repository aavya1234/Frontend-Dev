<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration form</title>
</head>
<body>
    <header>
        <h1>Course Registration Form</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Personal Information</legend>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

                <label for="email">E-Mail:</label>
                <input type="email" id="email" name="email" placeholder="Enter your Email" required><br><br>

            </fieldset>
            <br>
            <fieldset>
                <legend>Course Selection</legend>
                <label for="course">Course:</label>
                <select id="course" id="course" name="course" required>
                    <option value="webdev">Web Development</option>
                    <option value="ai">Artificial Intelligence</option>
                    <option value="datasci">Data Science</option>
                    <option value="ml">Machine Learning</option>
                </select>
            </fieldset>
            <br>
            <input type="submit" value="Register">
        </form>
        <section id="schedule">
            <h2>Available Course Schedules</h2>
            <table border="1" cellpadding="8" cellspacing="0">
                <thead>
                    <tr>
                        <th>Day</th>
                        <th>Time</th>
                        <th>Instructor</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Monday</td>
                        <td>10:00 AM - 12:00 PM</td>
                        <td>Mr. Ramesh Sharma</td>
                    </tr>
                     <tr>
                        <td>Wednesday</td>
                        <td>12:00 PM - 2:00 PM</td>
                        <td>Miss. Riya Sharma</td>
                    </tr>
                     <tr>
                        <td>Friday</td>
                        <td>10:00 AM - 12:00 PM</td>
                        <td>Mr. Rahul</td>
                    </tr>

                </tbody>
                </table>
        </section>

    </main>
</body>
</html>
